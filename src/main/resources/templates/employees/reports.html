<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Báo Cáo Thống Kê</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body class="container py-4">
<a th:href="@{/employees}" class="btn btn-outline-secondary mb-3">&larr; Quay lại danh sách</a>

<h3 class="text-primary mb-3">1. Thống kê theo Phòng Ban (Department)</h3>
<table class="table table-bordered table-striped mb-4">
    <thead class="table-dark">
    <tr>
        <th>Tên Phòng Ban</th>
        <th>Số Lượng NV</th>
        <th>Lương Trung Bình</th>
        <th>Tổng Lương</th>
    </tr>
    </thead>
    <tbody>
    <tr th:each="s : ${stats}">
        <td th:text="${s.departmentName}"></td>
        <td th:text="${s.employeeCount}"></td>
        <td th:text="${#numbers.formatDecimal(s.avgSalary, 0, 'COMMA', 0, 'POINT')} + ' VNĐ'"></td>
        <td th:text="${#numbers.formatDecimal(s.totalSalary, 0, 'COMMA', 0, 'POINT')} + ' VNĐ'"></td>
    </tr>
    </tbody>
</table>

<h3 class="text-danger mb-3">2. Phòng Ban Chưa Có Nhân Viên Nào</h3>
<ul class="list-group mb-4" style="max-width: 400px;">
    <li class="list-group-item" th:each="d : ${emptyDepartments}" th:text="${d.name}"></li>
    <li class="list-group-item text-muted" th:if="${#lists.isEmpty(emptyDepartments)}">(Không có phòng ban trống)</li>
</ul>
</body>
</html>
