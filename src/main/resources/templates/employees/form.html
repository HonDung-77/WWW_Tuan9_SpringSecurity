<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Thông Tin Nhân Viên</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body class="container py-4" style="max-width: 600px;">
<h3 class="mb-4 text-center text-primary" th:text="${employee.id == null} ? 'Thêm Nhân Viên Mới' : 'Cập Nhật Nhân Viên'"></h3>

<form th:action="@{/employees/save}" th:object="${employee}" method="post" class="card p-4 shadow-sm">
    <input type="hidden" th:field="*{id}" />

    <div class="mb-3">
        <label class="form-label">Họ và Tên:</label>
        <input type="text" th:field="*{name}" class="form-control" required />
    </div>

    <div class="mb-3">
        <label class="form-label">Vai trò / Chức danh (Role):</label>
        <input type="text" th:field="*{role}" class="form-control" />
    </div>

    <div class="row">
        <div class="col-md-6 mb-3">
            <label class="form-label">Tuổi:</label>
            <input type="number" th:field="*{age}" class="form-control" min="18" required />
        </div>
        <div class="col-md-6 mb-3">
            <label class="form-label">Lương:</label>
            <input type="number" step="any" th:field="*{salary}" class="form-control" min="0" required />
        </div>
    </div>

    <div class="row">
        <div class="col-md-6 mb-3">
            <label class="form-label">Phòng Ban (Department):</label>
            <select th:field="*{departmentId}" class="form-select">
                <option value="">-- Chọn --</option>
                <option th:each="d : ${departments}" th:value="${d.id}" th:text="${d.name}"></option>
            </select>
        </div>
        <div class="col-md-6 mb-3">
            <label class="form-label">Vị Trí (Position):</label>
            <select th:field="*{positionId}" class="form-select">
                <option value="">-- Chọn --</option>
                <option th:each="p : ${positions}" th:value="${p.id}" th:text="${p.title}"></option>
            </select>
        </div>
    </div>

    <div class="d-flex justify-content-between mt-3">
        <a th:href="@{/employees}" class="btn btn-secondary">Hủy</a>
        <button type="submit" class="btn btn-primary">Lưu Lại</button>
    </div>
</form>
</body>
</html>
